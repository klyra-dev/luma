<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luma — Brightness</title>
  <style>
    :root {
      --bg: #fff;
      --muted: #6b7280;
      --accent: #2563eb;
      --border: #e6e6e9;
      --radius: 8px;
      --shadow: 0 6px 18px rgba(16, 24, 40, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 12px;
      width: 280px;
      background: var(--bg);
      color: #111827;
      font-size: 13px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .logo {
      width: 36px;
      height: 36px;
      min-width: 36px;
      border-radius: 8px;
      background: linear-gradient(135deg, #9ad0ff, #5aa7ff);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: 16px;
      box-shadow: var(--shadow);
    }

    h1 {
      font-size: 15px;
      margin: 0;
      line-height: 1.2;
      font-weight: 600;
    }

    p.subtitle {
      margin: 2px 0 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.3;
    }

    .control {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 28px;
      background: transparent;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 6px;
      background: var(--border);
      border-radius: 999px;
      border: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      margin-top: -6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.22);
      border: 2px solid #fff;
      cursor: pointer;
    }

    input[type="range"]::-moz-range-track {
      height: 6px;
      background: var(--border);
      border-radius: 999px;
      border: none;
    }

    input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.22);
      border: 2px solid #fff;
      cursor: pointer;
    }

    .value {
      min-width: 56px;
      text-align: right;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      font-weight: 500;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    button {
      border: 1px solid var(--border);
      background: #fff;
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      color: #111827;
      font-weight: 500;
      transition: all 0.15s ease;
    }

    button:hover {
      background: #f3f4f6;
    }

    button.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    button.primary:hover {
      background: #1d4ed8;
    }

    button.ghost {
      background: transparent;
      border-color: transparent;
    }

    button.ghost:hover {
      background: #f3f4f6;
    }

    footer {
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    small {
      color: var(--muted);
      font-size: 11px;
    }

    a.repo {
      color: var(--accent);
      text-decoration: none;
      font-size: 12px;
    }

    a.repo:hover {
      text-decoration: underline;
    }

    .sr-only {
      position: absolute !important;
      height: 1px;
      width: 1px;
      overflow: hidden;
      clip: rect(1px, 1px, 1px, 1px);
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo" aria-hidden="true">L</div>
    <div>
      <h1>Luma</h1>
      <p class="subtitle">Brightness control</p>
    </div>
  </header>

  <label for="brightness" class="sr-only">Page brightness</label>
  <div class="control">
    <input id="brightness" type="range" min="50" max="150" step="1" value="100">
    <div id="value" class="value">100%</div>
  </div>

  <div class="actions">
    <button id="saveGlobal" class="primary">Save Global</button>
    <button id="saveSite">Save Site</button>
    <button id="resetSite" class="ghost">Reset Site</button>
    <button id="resetGlobal" class="ghost">Reset Global</button>
  </div>

  <footer>
    <small>No data leaves your browser</small>
    <a id="openRepo" class="repo" href="#" target="_blank" rel="noopener">GitHub</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
